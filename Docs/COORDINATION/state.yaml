    status: frozen
  - id: DEC-004
    statement: "本协调层是工作层不是架构权威层;单主 ledger = preprocessing 仓库;EB id 只由此分配"
    authority: "用户批准 v0.1 落地(2026-09-15);PROTOCOL.md"
