    statement: "P3.2/EB-004 正式放行: APPROVED TO PROCEED — EXPERIMENT ONLY(实验性 Enforcement Verification,非生产架构变更授权)。允许链: Producer Manifest → Experimental Adapter → 构造 Evidence/Resolved Evidence → Admission Boundary → 验证非法 Evidence 是否被阻止。禁止: 修改生产 Resolver / Frozen Spec / Producer Contract / Gate policy / Admission semantics / 为提高通过率放宽规则 / 把实验结果直接视为架构 Decision / 因实验失败自动提 workaround。前置: 修正 A(claude4-attribution.json 卷名)+ 修正 B(cross-corpus 表述/EB 编号)必须先完成。流程: Scope Document(五要素: Scope/Inputs/Metrics/Negative Acceptance/Non-goals)→ DSH 核验 Scope → 实验。核心指标 = bypass path count;核心攻击项 = N7(绕过 promotion 直连 Admission)/ N8(gate approve 但 Evidence Authority 无效)"
    authority: "用户正式裁定 2026-09-15(聊天原文入 log.md 本轮)"
    status: active
  - id: DEC-011
    statement: "EB-005 与 P3.2/EB-004 严格分离,不得合并:EB-005 = 输入链路缺口(Producer Evidence → Production Resolver 正式 adoption path),EB-004 = 最终准入约束缺口(Evidence Authority 是否真正 enforcement)。EB-005 保持 OPEN,暂不实现;实验中发现的问题只能 OBSERVED → EVIDENCE → REPORT,不得自行修改架构"
