[pytest]
# DSH 沙箱下系统 temp 与 rmtree 均受限(WinError 5),禁用 pytest 内建
# tmp_path/cacheprovider;所有测试用 conftest.workdir fixture(仓库内自管目录)。
addopts = -p no:cacheprovider
# 收集范围与 CI(ci.yml: pytest tests/)一致:裸 pytest 只收 tests/,
# 防止误收 _archive 等归档区里的历史 test_*.py(R39 实测)。
testpaths = tests
# 防御:沙箱可能在仓库根留下 ACL 异常的 pytest-cache-files-* 空目录,
# pytest 收集期遍历到会 PermissionError 全灭(R39 实测),一律不递归。
norecursedirs = .* pytest-cache-files-* .pytest_work .pytest_tmp build dist *.egg*
